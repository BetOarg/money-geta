name: Safety and integration tests

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest
      - name: Parse Windows bootstrap script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $script = Join-Path $PWD "install_windows.ps1"
          [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }

  upstream-patch-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate pinned source metadata and safety overlay
        shell: bash
        run: |
          set -euo pipefail
          grep -q "c8208b6a0d9d0e4ddc93cfcd1ee123baeb0bb50a" docs/UPSTREAM_INTEGRATION.md
          test -s patches/gtavi-claudecode/live-session-isolation.patch
          grep -q "c8208b6a0d9d0e4ddc93cfcd1ee123baeb0bb50a" scripts/money_geta.py
          echo "Manifest verified. Exact upstream apply-check remains a local operation via money-geta upstream-check."

  moneyprinterturbo-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone MoneyPrinterTurbo public source
        run: git clone --depth 1 https://github.com/harry0703/MoneyPrinterTurbo.git upstream-mpt
      - name: Verify supported CLI argument contract
        shell: bash
        run: |
          set -euo pipefail
          cd upstream-mpt
          for flag in --video-subject --video-source --video-materials --video-aspect --video-count --video-language --voice-name --stop-at; do
            grep -q -- "$flag" cli.py
          done
          echo "Current public CLI declares all arguments used by the Money-Geta adapter."
