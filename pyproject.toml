[project]
name = "money-geta"
version = "0.2.0"
description = "Operational control plane for a local-first GTA VI video workflow"
requires-python = ">=3.10"

[project.scripts]
money-geta = "scripts.money_geta:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
